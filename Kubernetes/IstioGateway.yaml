# Gateway — handles external traffic
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: main-gateway
  namespace: default
spec:
  selector:
    istio: ingressgateway     # targets Istio's ingress gateway pod
  servers:
    - port:
        number: 8080
        name: http
        protocol: HTTP
      hosts:
        - "frontend.local"
        - "backend.local"
---
# VirtualService for frontend
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: frontend-vs
  namespace: default
spec:
  hosts:
    - "frontend.local"
  gateways:
    - main-gateway
  http:
    - route:
        - destination:
            host: react-svc
            port:
              number: 3000
---
# VirtualService for backend
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: backend-vs
  namespace: default
spec:
  hosts:
    - "backend.local"
  gateways:
    - main-gateway
  http:
    - route:
        - destination:
            host: golang-svc
            port:
              number: 5000